name: Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npx vercel@latest pull --yes --environment=production --scope=rbpalmiano-5714s-projects --project=micro-workout --token=${{ secrets.VERCEL_TOKEN }}
      - run: npx vercel@latest build --prod --scope=rbpalmiano-5714s-projects --project=micro-workout --token=${{ secrets.VERCEL_TOKEN }}
      - run: npx vercel@latest env run --environment=production --scope=rbpalmiano-5714s-projects --project=micro-workout --token=${{ secrets.VERCEL_TOKEN }} -- npm run db:migrate
      - run: npx vercel@latest deploy --prebuilt --prod --scope=rbpalmiano-5714s-projects --project=micro-workout --token=${{ secrets.VERCEL_TOKEN }}
